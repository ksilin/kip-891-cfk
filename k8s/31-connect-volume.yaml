# Volume route. Stock image, the PersistentVolumeClaim from 25-plugins-pvc.yaml on plugin.path. No spec.build.
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:8.3.2
    init: confluentinc/confluent-init-container:3.3.0
  mountedVolumes:
    volumes:
      - name: plugins
        persistentVolumeClaim:
          claimName: connect-plugins
    volumeMounts:
      - name: plugins
        mountPath: /opt/plugins
        readOnly: true
  configOverrides:
    jvm:
      - "-Xmx640m"
      - "-Xms256m"
    server:
      - plugin.path=/usr/share/java,/usr/share/confluent-hub-components,/opt/plugins
      - config.storage.replication.factor=1
      - offset.storage.replication.factor=1
      - status.storage.replication.factor=1
