# One KRaft controller, one broker, plaintext. Heaps and replication factors are sized for a laptop.
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 1Gi
  image:
    application: confluentinc/cp-server:8.3.2
    init: confluentinc/confluent-init-container:3.3.0
  configOverrides:
    jvm:
      - "-Xmx256m"
      - "-Xms128m"
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 2Gi
  image:
    application: confluentinc/cp-server:8.3.2
    init: confluentinc/confluent-init-container:3.3.0
  metricReporter:
    enabled: false
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
  configOverrides:
    jvm:
      - "-Xmx512m"
      - "-Xms256m"
    server:
      - offsets.topic.replication.factor=1
      - transaction.state.log.replication.factor=1
      - transaction.state.log.min.isr=1
      - confluent.license.topic.replication.factor=1
      - confluent.balancer.enable=false
      - confluent.durability.topic.replication.factor=1
      - confluent.tier.metadata.replication.factor=1
      - confluent.cluster.link.metadata.topic.replication.factor=1
